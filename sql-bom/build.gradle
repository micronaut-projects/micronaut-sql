plugins {
    id 'io.micronaut.build.internal.bom'
}

micronautBom {
    excludeProject.set({ p ->
        p.path.startsWith(':test')
    } as Spec<Project>)
}

micronautBom {
    suppressions {
        acceptedLibraryRegressions.add("micronaut-hibernate-jpa-spring")
        acceptedLibraryRegressions.add("micronaut-jdbc-unpooled")
        acceptedVersionRegressions.add("commons-dbcp-compat")
        acceptedLibraryRegressions.add("commons-dbcp")
        dependencies.add("org.hibernate.models:hibernate-models:1.1.1")
        dependencies.add("jakarta.persistence:jakarta.persistence-api:3.2.0")
        dependencies.add("jakarta.transaction:jakarta.transaction-api:2.0.1")
        dependencies.add("jakarta.data:jakarta.data-api:1.0.1")
        dependencies.add("org.antlr:antlr4-runtime:4.13.2")
        dependencies.add("org.jboss.logging:jboss-logging:3.6.1.Final")
        dependencies.add("net.bytebuddy:byte-buddy:1.18.8")
        dependencies.add("net.bytebuddy:byte-buddy-agent:1.18.8")
        dependencies.add("io.smallrye:jandex:3.3.2")
        dependencies.add("org.glassfish.jaxb:jaxb-runtime:4.0.6")
        dependencies.add("jakarta.xml.bind:jakarta.xml.bind-api:4.0.4")
        dependencies.add("jakarta.inject:jakarta.inject-api:2.0.1")
        dependencies.add("io.agroal:agroal-api:2.8")
        dependencies.add("io.agroal:agroal-pool:2.8")
        dependencies.add("com.mchange:c3p0:0.12.0")
        dependencies.add("com.zaxxer:HikariCP:7.0.2")
        dependencies.add("javax.cache:cache-api:1.1.1")
        dependencies.add("io.micrometer:micrometer-core:1.16.0")
        dependencies.add("org.hibernate.orm:hibernate-gradle-plugin:7.3.1.Final")
    }
}
