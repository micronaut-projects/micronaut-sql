plugins {
    id 'io.micronaut.build.internal.module'
    id 'io.micronaut.build.internal.sql-base'
}

def h2Version = libs.versions.managed.h2.get()

ossIndexAudit {
    excludeCoordinates = [
            "com.h2database:h2:${h2Version}" // no version patched https://ossindex.sonatype.org/component/pkg:maven/com.h2database/h2
    ]
}

tasks.withType(org.gradle.api.tasks.testing.Test).configureEach {
    systemProperty('h2.version', h2Version)
}

micronautBuild {
    descriptor {
        parentModuleId = "io.micronaut.sql:micronaut-sql-jdbc"
    }
}
