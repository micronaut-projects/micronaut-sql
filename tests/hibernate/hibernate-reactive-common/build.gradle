plugins {
    id("io.micronaut.build.internal.test-application-hibernate")
}

dependencies {
    implementation projects.micronautTests.micronautCommonReactive
    implementation mnReactor.micronaut.reactor
    implementation mn.micronaut.http.client
    implementation projects.micronautHibernateReactive
    implementation projects.micronautJdbc
    implementation mnTest.micronaut.test.junit5

    runtimeOnly(mn.snakeyaml)
    runtimeOnly(mnData.micronaut.data.model)
}

graalvmNative {
    binaries {
        all {
            if (System.getenv("GRAALVM_HOME")?.contains("graal") && System.getenv("GRAALVM_HOME")?.contains("25")) {
                logger.quiet("Enabling SharedArenaSupport for GraalVM 25")
                buildArgs.add("-H:+SharedArenaSupport")
            }
        }
    }
}
