plugins {
    id 'io.micronaut.build.internal.test-application'
}

dependencies {
    implementation projects.micronautJdbcUcp
    implementation projects.micronautTests.micronautCommonSync

    testImplementation projects.micronautTests.micronautCommonTests
    testImplementation(mnData.micronaut.data.tx.jdbc)

    // Temporary workaround: Test Resources Oracle Free's JDBC readiness check needs
    // ojdbc17 in its separate JVM; see https://github.com/micronaut-projects/micronaut-test-resources/pull/1231.
    testResourcesRuntimeOnly(libs.managed.ojdbc17)
}

micronaut {
    testResources {
        additionalModules.add("jdbc-oracle-free")
    }
}
